site_name: FMW Research
site_description: Research notes beside the Federal Modernization Workbook. Not workbook guidance.
site_url: https://whalermike.github.io/fmw-research/
repo_url: https://github.com/WhalerMike/fmw-research
repo_name: WhalerMike/fmw-research
copyright: Copyright &copy; 2026 Michael F. Stratton. Research notes, not Federal Modernization Workbook guidance.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - How this project works: about.md
  - Research log: log.md
  - Topics:
      - AI bot costs: topics/ai-bot-costs.md
      - Microsoft 365 Copilot compared with AI agents: topics/copilot-vs-agents-gcc-moderate.md
      - Scheduling a daily report job: topics/daily-report-scheduling.md
  - ServiceNow sandbox:
      - Overview and what a MID Server is: sandbox/index.md
      - 1. MID Server running as a gMSA: sandbox/pack-1-mid-server-gmsa.md
      - 2. Service account for on-premises reads: sandbox/pack-2-service-account-credential.md
      - 3. Scheduled job on workdays: sandbox/pack-3-scheduled-workdays.md
      - 4. Graph with a certificate: sandbox/pack-4-graph-certificate.md
      - 5. Report record and instance email: sandbox/pack-5-record-and-email.md
      - Results template: sandbox/results-template.md
  - Copilot InBox:
      - About the InBox: inbox/index.md
      - 001 Start package: inbox/001-start-package.md
  - Sources: sources.md

hooks:
  - hooks/inbox.py
  - hooks/packs_zip.py
